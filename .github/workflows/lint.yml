name: Linting
on:
  pull_request:
  push:
    branches: [main, master]


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      # Update output format to enable automatic inline annotations.
      - name: Run Ruff Check
        run: ruff check --output-format=github ./stonelog_airflow
      - name: Run Ruff Check
        run: ruff format -v ./stonelog_airflow